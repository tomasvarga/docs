openapi: 3.1.0
info:
  title: E2B API
  version: 0.1.0
  description: Complete E2B developer API. Platform endpoints are served on api.e2b.app.
    Sandbox endpoints (envd) are served on {port}-{sandboxID}.e2b.app.
servers:
- &id001
  url: https://api.e2b.app
  description: E2B Platform API
paths:
  /templates/{templateID}/builds/{buildID}:
    post:
      description: Start the build
      deprecated: true
      tags:
      - Templates
      security:
      - AccessTokenAuth: []
      - AuthProviderBearerAuth: []
        AuthProviderTeamAuth: []
      parameters:
      - $ref: '#/components/parameters/templateID'
      - $ref: '#/components/parameters/buildID'
      responses:
        '202':
          description: The build has started
          content:
            application/json:
              schema:
                type: object
                description: Empty response
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
      operationId: postTemplateBuild
      summary: Start build
    servers:
    - *id001
  /health:
    get:
      summary: Check the health of the service
      responses:
        '204':
          description: The service is healthy
        '502': &id002
          description: Sandbox not found
          content:
            application/json:
              schema:
                type: object
                required:
                - sandboxID
                - message
                - code
                properties:
                  message:
                    type: string
                    description: Error message
                  code:
                    type: integer
                    description: Error code
                  sandboxID:
                    type: string
                    description: Identifier of the sandbox
      operationId: getHealth
      security: []
      tags:
      - Envd
    servers:
    - &id003
      url: https://{port}-{sandboxID}.e2b.app
      description: Sandbox API (envd) — runs inside each sandbox
      variables:
        port:
          default: '49983'
          description: Port number
        sandboxID:
          default: $SANDBOX_ID
          description: Sandbox identifier
  /metrics:
    get:
      summary: Get the stats of the service
      security:
      - &id004
        SandboxAccessTokenAuth: []
      responses:
        '200':
          description: The resource usage metrics of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
        '502': *id002
      operationId: getMetrics
      tags:
      - Envd
    servers:
    - *id003
  /freeze:
    post:
      summary: Freeze user/pty cgroups before pause. Written directly by envd to avoid
        Process.Start / shell overhead under load.
      security:
      - *id004
      responses:
        '204':
          description: Cgroups frozen
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Freeze lock is held by another operation
        '502': *id002
      operationId: postFreeze
      tags:
      - Envd
    servers:
    - *id003
  /unfreeze:
    post:
      summary: Unfreeze user/pty cgroups. Intended ONLY for the orchestrator's pause-failure
        rollback path; the normal resume thaw happens via /init's deferred unfreeze,
        not here.
      security:
      - *id004
      responses:
        '204':
          description: Cgroups unfrozen
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Freeze lock is held by another operation
        '502': *id002
      operationId: postUnfreeze
      tags:
      - Envd
    servers:
    - *id003
  /collapse:
    post:
      summary: Collapse envd's own anonymous heap into 2 MiB transparent hugepages
        before pause, so on resume envd touches fewer distinct guest-physical frames
        (each a cold fault). Best-effort.
      security:
      - *id004
      responses:
        '200':
          description: Heap collapsed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollapseResult'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502': *id002
      operationId: postCollapse
      tags:
      - Envd
    servers:
    - *id003
  /fsfreeze:
    post:
      summary: Freeze the guest rootfs (FIFREEZE) before a filesystem-only pause so
        it is flushed to a consistent on-disk state, closing the sync->pause race.
        Idempotent. On a successful filesystem-only pause the VM is rebooted, so no
        thaw is needed; the orchestrator thaws only on the pause-failure path.
      security:
      - *id004
      responses:
        '204':
          description: Rootfs frozen
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Freeze lock is held by another operation
        '502': *id002
      operationId: postFsfreeze
      tags:
      - Envd
    servers:
    - *id003
  /fsthaw:
    post:
      summary: Thaw the guest rootfs (FITHAW). Intended ONLY for the orchestrator's
        pause-failure rollback path, so a frozen filesystem cannot leave the live
        VM deadlocked. Idempotent.
      security:
      - *id004
      responses:
        '204':
          description: Rootfs thawed
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Freeze lock is held by another operation
        '502': *id002
      operationId: postFsthaw
      tags:
      - Envd
    servers:
    - *id003
  /envs:
    get:
      summary: Get the environment variables
      security:
      - *id004
      responses:
        '200':
          description: Environment variables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvVars'
        '502': *id002
      operationId: getEnvVars
      tags:
      - Envd
    servers:
    - *id003
  /files:
    get:
      summary: Download a file
      tags:
      - Filesystem
      security:
      - *id004
      parameters:
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/User'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/SignatureExpiration'
      responses:
        '200':
          description: Entire file downloaded successfully.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: The raw file content
        '400':
          description: Invalid path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: path '/home/user/docs' is a directory
                code: 400
        '401':
          description: Invalid user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'error looking up user ''nonexistent'': user: unknown user
                  nonexistent'
                code: 401
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: path '/home/user/missing.txt' does not exist
                code: 404
        '406':
          description: Requested encoding is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'no acceptable encoding found, supported: [identity, gzip]'
                code: 406
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'error opening file ''/home/user/file.txt'': permission denied'
                code: 500
        '502': *id002
      operationId: downloadFile
    post:
      summary: Upload a file and ensure the parent directories exist. If the file
        exists, it will be overwritten.
      description: 'Any request header of the form `X-Metadata-<key>: <value>` is
        persisted

        as a user-defined extended attribute on the uploaded file. The

        `X-Metadata-` prefix is stripped and the remaining header name is

        lowercased to form the metadata key; the resulting map is returned on

        `EntryInfo` lookups (e.g. `Stat`, `ListDir`).


        Each upload replaces the file''s metadata with the keys provided in

        that request: keys previously stored but absent from the new request

        are removed, and an upload that sends no `X-Metadata-*` header clears

        all existing metadata.


        Both keys and values must be printable US-ASCII (bytes `0x20`-`0x7E`)

        and are rejected with HTTP 400 otherwise. Each key is capped at 246

        bytes (the Linux VFS xattr-name limit minus the namespace prefix), and

        the combined size of all metadata on a file (keys plus values, with the

        namespace prefix counted per key) is capped at 4096 bytes to stay within

        the filesystem''s per-inode xattr budget. Multiple files in a single

        multipart upload receive the same metadata. If the same

        `X-Metadata-<key>` header is sent more than once, only the first

        value is used.

        '
      tags:
      - Filesystem
      security:
      - *id004
      parameters:
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/User'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/SignatureExpiration'
      requestBody:
        $ref: '#/components/requestBodies/File'
      responses:
        '200':
          description: The file was uploaded successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntryInfo'
              example:
              - path: /home/user/hello.txt
                name: hello.txt
                type: file
        '400':
          description: Invalid path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: path '/home/user/docs' is a directory
                code: 400
        '401':
          description: Invalid user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'error looking up user ''nonexistent'': user: unknown user
                  nonexistent'
                code: 401
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'error opening file ''/home/user/file.txt'': permission denied'
                code: 500
        '507':
          description: Not enough disk space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: not enough disk space available
                code: 507
        '502': *id002
      operationId: uploadFile
    servers:
    - *id003
  /files/compose:
    post:
      summary: Compose multiple files into a single file using zero-copy concatenation.
